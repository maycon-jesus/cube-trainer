allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - sharp@0.35.0 || 0.35.4 || 0.35.5
  - brace-expansion@2.1.5 || 2.1.6 || 2.1.7 || 5.0.8 || 5.0.10 || 5.0.11 || 5.0.12
  - fast-uri@3.1.5 || 3.1.6
  - nanoid@3.3.18
  - js-yaml@4.3.2
  - svgo@4.1.0
  - devalue@5.9.3
  - node-forge@1.4.1
  - '@simple-git/argv-parser@2.0.1'
  - simple-git@3.36.1 || 4.0.1
  - source-map-js@1.2.2
  - shell-quote@1.11.0
  - vite@8.2.4
  - launch-editor@2.14.2
  - '@modelcontextprotocol/server@2.3.0'
  - '@nuxt/nitro-server@4.6.2'
  - nuxt@4.6.0 || 4.6.2
  - zod@4.6.6
  - undici@8.12.2
  - serialize-javascript@7.1.3
overrides:
  h3: ^1.15.11
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
