allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  sharp: true
  unrs-resolver: true
minimumReleaseAgeExclude:
  - esbuild@0.28.1
  - sharp@0.35.0 || 0.35.4
  - brace-expansion@5.0.8
  - fast-uri@3.1.5 || 3.1.6
  - nanoid@3.3.18
  - js-yaml@4.3.2
  - svgo@4.1.0
overrides:
  h3: ^1.15.11
supportedArchitectures:
  os:
    - current
    - linux
  cpu:
    - current
    - x64
    - arm64
